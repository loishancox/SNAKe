<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Snake I</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: monospace;
        }

        /* Container sized appropriately for tiny/1.8" displays */
        #screen-container {
            width: 100vw;
            height: 100vh;
            max-width: 128px;
            max-height: 160px;
            background-color: #8b956d; /* Nokia / GameBoy monochrome green LCD */
            border: 4px solid #2b3318;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            color: #2b3318;
            padding: 0 2px;
            line-height: 1;
        }

        canvas {
            background-color: #8b956d;
            border: 1px solid #2b3318;
            image-rendering: pixelated;
        }

        #footer {
            font-size: 8px;
            font-weight: bold;
            color: #2b3318;
            text-align: center;
            height: 10px;
            line-height: 10px;
        }
    </style>
</head>
<body>

<div id="screen-container">
    <div id="header">
        <span>SNAKE</span>
        <span id="score">0</span>
    </div>
    <canvas id="gameCanvas" width="84" height="48"></canvas>
    <div id="footer" id="status">2,4,6,8:MOVE 5:PAUSE</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const statusElement = document.getElementById("footer");

    // Original Nokia 84x48 resolution grid setup
    const gridWidth = 21;
    const gridHeight = 12;
    const pixelSize = 4; // 21*4 = 84, 12*4 = 48

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let isPaused = false;
    let gameOver = false;
    let gameInterval;

    function initGame() {
        snake = [
            { x: 5, y: 6 },
            { x: 4, y: 6 },
            { x: 3, y: 6 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        isPaused = false;
        scoreElement.textContent = score;
        statusElement.textContent = "2,4,6,8:MOVE 5:PAUSE";
        placeFood();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 150); // Original Snake I speed
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food.x = Math.floor(Math.random() * gridWidth);
            food.y = Math.floor(Math.random() * gridHeight);
            valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
        }
    }

    function gameLoop() {
        if (isPaused || gameOver) return;

        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Wall collisions (Snake 1 has wall boundaries)
        if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
            triggerGameOver();
            return;
        }

        // Self collision
        if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
            triggerGameOver();
            return;
        }

        snake.unshift(head);

        // Eat Food
        if (head.x === food.x && head.y === food.y) {
            score += 1;
            scoreElement.textContent = score;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Clear screen with LCD background color
        ctx.fillStyle = "#8b956d";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Snake (Monochrome Dark Green/Black Pixels)
        ctx.fillStyle = "#2b3318";
        snake.forEach((segment, index) => {
            // Main segment body
            ctx.fillRect(
                segment.x * pixelSize, 
                segment.y * pixelSize, 
                pixelSize - 1, 
                pixelSize - 1
            );
        });

        // Draw Food (Single pixel dot style)
        ctx.fillRect(
            food.x * pixelSize + 1, 
            food.y * pixelSize + 1, 
            pixelSize - 2, 
            pixelSize - 2
        );
    }

    function triggerGameOver() {
        gameOver = true;
        statusElement.textContent = "GAME OVER! PRESS 5";
        ctx.fillStyle = "#2b3318";
        ctx.font = "8px monospace";
        ctx.fillText("GAME OVER", 18, 26);
    }

    // Keypad Controls Logic (Keyboard Numpad & Standard Numbers)
    window.addEventListener("keydown", (e) => {
        const key = e.key;

        if (gameOver) {
            if (key === "5" || key === "Enter") {
                initGame();
            }
            return;
        }

        // 2: UP
        if ((key === "2" || key === "ArrowUp") && dir.y === 0) {
            nextDir = { x: 0, y: -1 };
        }
        // 8: DOWN
        else if ((key === "8" || key === "ArrowDown") && dir.y === 0) {
            nextDir = { x: 0, y: 1 };
        }
        // 4: LEFT
        else if ((key === "4" || key === "ArrowLeft") && dir.x === 0) {
            nextDir = { x: -1, y: 0 };
        }
        // 6: RIGHT
        else if ((key === "6" || key === "ArrowRight") && dir.x === 0) {
            nextDir = { x: 1, y: 0 };
        }
        // 5 or OK / Enter: PAUSE / UNPAUSE
        else if (key === "5" || key === "Enter" || key.toLowerCase() === "ok") {
            isPaused = !isPaused;
            statusElement.textContent = isPaused ? "PAUSED" : "2,4,6,8:MOVE 5:PAUSE";
        }
    });

    // Auto-start immediately upon loading
    initGame();
</script>

</body>
</html>
