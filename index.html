<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake - Sony Remote Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f380f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #0f380f;
      overflow: hidden;
    }
    #game-container {
      background-color: #9bbc0f;
      border: 12px solid #8bac0f;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #header {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    canvas {
      background-color: #8bac0f;
      border: 4px solid #306230;
      display: block;
    }
    #footer {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <span id="mode-text">SNAKE I</span>
    <span id="score-text">SCORE: 0</span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="footer">
    D-PAD: Move | OK: Pause/Restart | 1: Snake I | 2: Snake II
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElem = document.getElementById("score-text");
  const modeElem = document.getElementById("mode-text");

  const GRID_SIZE = 20;
  const TILE_COUNT = canvas.width / GRID_SIZE;

  let gameMode = 1; // 1 = Snake 1 (Solid Walls), 2 = Snake 2 (Screen Wrap)
  let snake = [{ x: 10, y: 10 }];
  let dx = 1, dy = 0;
  let nextDx = 1, nextDy = 0;
  let food = { x: 5, y: 5 };
  let score = 0;
  let isPaused = false;
  let gameOver = false;

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    dx = 1; dy = 0;
    nextDx = 1; nextDy = 0;
    score = 0;
    scoreElem.innerText = "SCORE: " + score;
    gameOver = false;
    isPaused = false;
    spawnFood();
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * TILE_COUNT);
    food.y = Math.floor(Math.random() * TILE_COUNT);
  }

  function update() {
    if (isPaused || gameOver) return;

    dx = nextDx;
    dy = nextDy;

    let head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Snake II Mode: Wrap around screen borders
    if (gameMode === 2) {
      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;
    } else {
      // Snake I Mode: Wall collision = Game Over
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver = true;
        return;
      }
    }

    // Self-collision check
    for (let i = 0; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        gameOver = true;
        return;
      }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreElem.innerText = "SCORE: " + score;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // Game Boy light olive green background
    ctx.fillStyle = "#8bac0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Snake I outer border
    if (gameMode === 1) {
      ctx.strokeStyle = "#0f380f";
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    // Draw Food (Dark green block)
    ctx.fillStyle = "#0f380f";
    ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2);

    // Draw Snake body
    ctx.fillStyle = "#306230";
    snake.forEach(part => {
      ctx.fillRect(part.x * GRID_SIZE, part.y * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2);
    });

    // Overlays
    if (isPaused) {
      ctx.fillStyle = "#0f380f";
      ctx.font = "24px monospace";
      ctx.fillText("PAUSED", 150, 200);
    } else if (gameOver) {
      ctx.fillStyle = "#0f380f";
      ctx.font = "24px monospace";
      ctx.fillText("GAME OVER", 130, 190);
      ctx.font = "14px monospace";
      ctx.fillText("Press OK to Restart", 120, 220);
    }
  }

  function main() {
    update();
    draw();
  }

  // Key Event Handlers for Sony Remote Mapping
  window.addEventListener("keydown", function(e) {
    const key = e.keyCode || e.which;

    // Prevent TV browser from scrolling on D-pad navigation
    if([37, 38, 39, 40, 13].indexOf(key) > -1) {
      e.preventDefault();
    }

    switch (key) {
      // D-Pad Movement
      case 37: // Left Arrow
        if (dx === 0) { nextDx = -1; nextDy = 0; }
        break;
      case 38: // Up Arrow
        if (dy === 0) { nextDx = 0; nextDy = -1; }
        break;
      case 39: // Right Arrow
        if (dx === 0) { nextDx = 1; nextDy = 0; }
        break;
      case 40: // Down Arrow
        if (dy === 0) { nextDx = 0; nextDy = 1; }
        break;

      // Central OK / Enter Button
      case 13:
      case 29443: // Sony TV specific select code
        if (gameOver) {
          resetGame();
        } else {
          isPaused = !isPaused;
        }
        break;

      // Number '1' Button (Snake I)
      case 49:
      case 18:
        gameMode = 1;
        modeElem.innerText = "SNAKE I";
        resetGame();
        break;

      // Number '2' Button (Snake II)
      case 50:
      case 19:
        gameMode = 2;
        modeElem.innerText = "SNAKE II";
        resetGame();
        break;
    }
  });

  resetGame();
  setInterval(main, 100);
</script>
</body>
</html>
