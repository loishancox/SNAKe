<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Screen TV Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      background-color: #0f380f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: monospace;
      color: #0f380f;
    }
    #game-container {
      background-color: #9bbc0f;
      border: 16px solid #8bac0f;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 95vw;
      height: 95vh;
    }
    #header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    canvas {
      background-color: #8bac0f;
      border: 6px solid #306230;
      display: block;
    }
    #footer {
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <span id="mode-text">SNAKE I</span>
    <span id="score-text">SCORE: 0</span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="footer">
    2: UP | 4: LEFT | 6: RIGHT | 8: DOWN | OK: SWITCH MODE / RESTART
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElem = document.getElementById("score-text");
  const modeElem = document.getElementById("mode-text");

  // Bigger grid size (40px blocks) so it doesn't take forever to cross
  const GRID_SIZE = 40; 
  let cols = 0;
  let rows = 0;

  let gameMode = 1; // 1 = Snake I (Solid Walls), 2 = Snake II (Wrap Walls)
  let snake = [];
  let dx = 1, dy = 0;
  let nextDx = 1, nextDy = 0;
  let food = { x: 0, y: 0 };
  let score = 0;
  let gameOver = false;

  function resizeCanvas() {
    const container = document.getElementById("game-container");
    const headerHeight = document.getElementById("header").offsetHeight;
    const footerHeight = document.getElementById("footer").offsetHeight;
    
    const availableWidth = container.clientWidth - 40;
    const availableHeight = container.clientHeight - headerHeight - footerHeight - 60;

    cols = Math.floor(availableWidth / GRID_SIZE);
    rows = Math.floor(availableHeight / GRID_SIZE);

    canvas.width = cols * GRID_SIZE;
    canvas.height = rows * GRID_SIZE;

    resetGame();
  }

  function resetGame() {
    const startX = Math.floor(cols / 2);
    const startY = Math.floor(rows / 2);
    snake = [{ x: startX, y: startY }];
    dx = 1; dy = 0;
    nextDx = 1; nextDy = 0;
    score = 0;
    scoreElem.innerText = "SCORE: " + score;
    gameOver = false;
    spawnFood();
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * cols);
    food.y = Math.floor(Math.random() * rows);
  }

  function update() {
    if (gameOver) return;

    dx = nextDx;
    dy = nextDy;

    let head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Snake II Mode: Wrap around screen borders
    if (gameMode === 2) {
      if (head.x < 0) head.x = cols - 1;
      if (head.x >= cols) head.x = 0;
      if (head.y < 0) head.y = rows - 1;
      if (head.y >= rows) head.y = 0;
    } else {
      // Snake I Mode: Wall collision = Game Over
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
        gameOver = true;
        return;
      }
    }

    // Self-collision check
    for (let i = 0; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        gameOver = true;
        return;
      }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreElem.innerText = "SCORE: " + score;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // Canvas Background (Game Boy light olive green)
    ctx.fillStyle = "#8bac0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Outer border for Snake I
    if (gameMode === 1) {
      ctx.strokeStyle = "#0f380f";
      ctx.lineWidth = 6;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    // Draw Food (Dark green block)
    ctx.fillStyle = "#0f380f";
    ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 4, GRID_SIZE - 4);

    // Draw Snake body (Chunky olive green blocks)
    ctx.fillStyle = "#306230";
    snake.forEach(part => {
      ctx.fillRect(part.x * GRID_SIZE, part.y * GRID_SIZE, GRID_SIZE - 4, GRID_SIZE - 4);
    });

    // Game Over Overlay
    if (gameOver) {
      ctx.fillStyle = "#0f380f";
      ctx.font = "bold 40px monospace";
      ctx.fillText("GAME OVER", (canvas.width / 2) - 110, canvas.height / 2);
      ctx.font = "20px monospace";
      ctx.fillText("Press OK to Restart", (canvas.width / 2) - 110, (canvas.height / 2) + 40);
    }
  }

  function main() {
    update();
    draw();
  }

  // Key Listeners for Sony Remote
  window.addEventListener("keydown", function(e) {
    const key = e.keyCode || e.which;

    if([37, 38, 39, 40, 13, 50, 52, 54, 56].indexOf(key) > -1) {
      e.preventDefault();
    }

    switch (key) {
      // 2 Key (UP)
      case 50:
      case 19:
        if (dy === 0) { nextDx = 0; nextDy = -1; }
        break;

      // 4 Key (LEFT)
      case 52:
      case 21:
        if (dx === 0) { nextDx = -1; nextDy = 0; }
        break;

      // 6 Key (RIGHT)
      case 54:
      case 23:
        if (dx === 0) { nextDx = 1; nextDy = 0; }
        break;

      // 8 Key (DOWN)
      case 56:
      case 25:
        if (dy === 0) { nextDx = 0; nextDy = 1; }
        break;

      // OK / Enter Button (Switch Mode OR Restart)
      case 13:
      case 29443:
        if (gameOver) {
          resetGame();
        } else {
          gameMode = (gameMode === 1) ? 2 : 1;
          modeElem.innerText = (gameMode === 1) ? "SNAKE I" : "SNAKE II";
          resetGame();
        }
        break;
    }
  });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  setInterval(main, 100);
</script>
</body>
</html>
