<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>Nokia SNAKe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; 
            background: #7d8c6b; 
            font-family: monospace; 
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #hud {
            position: absolute;
            top: 4px;
            right: 6px;
            color: #1c2416;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
        }
        canvas {
            width: 100%;
            flex-grow: 1;
            background: #8fa382;
            display: block;
            image-rendering: pixelated;
        }
        #keypad-hijack {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            z-index: 999;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <input type="text" id="keypad-hijack" autocomplete="off" inputmode="numeric" readonly>
        <div id="hud"><span id="score-lbl">0</span></div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreLbl = document.getElementById('score-lbl');
        const inputHijack = document.getElementById('keypad-hijack');

        const gridW = 20;
        const gridH = 22;
        let snake = [{x:5, y:10}, {x:4, y:10}, {x:3, y:10}];
        let dir = {x:1, y:0};
        let food = {x:12, y:10};
        let score = 0;
        let gameMode = 1;
        let sound = true;
        let isOver = false;
        
        let currentSpeed = 140;
        let gameLoopInterval = null;

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function keepFocus() {
            inputHijack.focus();
        }
        document.body.addEventListener('click', keepFocus);
        setInterval(keepFocus, 300);

        function resetTimer() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(loop, currentSpeed);
        }

        function handleInput(key) {
            if (isOver) { reset(); return; }

            if ((key === '2' || key === 'arrowup') && dir.y === 0) dir = {x:0, y:-1};
            if ((key === '8' || key === 'arrowdown') && dir.y === 0) dir = {x:0, y:1};
            if ((key === '4' || key === 'arrowleft') && dir.x === 0) dir = {x:-1, y:0};
            if ((key === '6' || key === 'arrowright') && dir.x === 0) dir = {x:1, y:0};
            
            if (key === '3') {
                currentSpeed = Math.max(40, currentSpeed - 20);
                resetTimer();
                beep(700, 0.03);
                return;
            }
            if (key === '1') {
                currentSpeed = Math.min(400, currentSpeed + 20);
                resetTimer();
                beep(500, 0.03);
                return;
            }
            if (key === '0') {
                gameMode = gameMode === 1 ? 2 : 1;
                reset();
            }
            if (key === '#') {
                sound = !sound;
                beep(500, 0.05);
            }
            if (key === '*') {
                document.body.style.background = document.body.style.background === 'rgb(0, 0, 0)' ? '#7d8c6b' : '#000';
                resize();
            }
            beep(600, 0.02);
        }

        window.addEventListener('keydown', function(e) {
            e.preventDefault();
            handleInput(e.key.toLowerCase());
        });

        inputHijack.addEventListener('input', function(e) {
            const val = inputHijack.value;
            if(val.length > 0) {
                const char = val.charAt(val.length - 1);
                handleInput(char);
                inputHijack.value = '';
            }
        });

        const audio = new (window.AudioContext || window.webkitAudioContext)();
        function beep(f, dur) {
            if(!sound) return;
            try {
                let o = audio.createOscillator();
                let g = audio.createGain();
                o.type = 'square'; o.frequency.value = f;
                g.gain.setValueAtTime(0.04, audio.currentTime);
                o.connect(g); g.connect(audio.destination);
                o.start(); o.stop(audio.currentTime + dur);
            } catch(e){}
        }

        function reset() {
            snake = [{x:5, y:10}, {x:4, y:10}, {x:3, y:10}];
            dir = {x:1, y:0};
            score = 0;
            scoreLbl.innerText = "0";
            isOver = false;
            dropFood();
            resetTimer();
        }

        function dropFood() {
            food.x = Math.floor(Math.random() * gridW);
            food.y = Math.floor(Math.random() * gridH);
        }

        function loop() {
            if(isOver) {
                ctx.fillStyle = '#1c2416';
                ctx.font = '14px monospace';
                ctx.fillText("0", canvas.width - 20, 15); 
                return;
            }

            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if(head.x >= gridW) head.x = 0; if(head.x < 0) head.x = gridW - 1;
            if(head.y >= gridH) head.y = 0; if(head.y < 0) head.y = gridH - 1;

            for(let i=0; i<snake.length; i++) {
                if(head.x === snake[i].x && head.y === snake[i].y) {
                    isOver = true;
                    beep(150, 0.3);
                }
            }

            if (isOver) return;

            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                score += 10;
                scoreLbl.innerText = score;
                beep(880, 0.04);
                dropFood();
            } else {
                snake.pop();
            }

            ctx.clearRect(0,0,canvas.width,canvas.height);
            let cw = canvas.width / gridW;
            let ch = canvas.height / gridH;

            ctx.fillStyle = '#1c2416';
            for(let i=0; i<snake.length; i++) {
                ctx.fillRect(snake[i].x * cw + 0.5, snake[i].y * ch + 0.5, cw - 1, ch - 1);
            }
            ctx.fillStyle = '#3a4d2f';
            ctx.fillRect(food.x * cw + 1, food.y * ch + 1, cw - 2, ch - 2);
        }

        resetTimer();
        setTimeout(keepFocus, 200);
    </script>
</body>
</html>
