<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SNAKe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f380f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #0f380f;
      overflow: hidden;
    }
    #game-container {
      background-color: #9bbc0f;
      border: 12px solid #8bac0f;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #header {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    canvas {
      background-color: #8bac0f;
      border: 4px solid #306230;
      display: block;
    }
    #footer {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <span id="mode-text">SNAKE I</span>
    <span id="score-text">SCORE: 0</span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="footer">
    2: UP | 4: LEFT | 6: RIGHT | 8: DOWN | OK: SWITCH MODE / RESTART
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElem = document.getElementById("score-text");
  const modeElem = document.getElementById("mode-text");

  const GRID_SIZE = 20;
  const TILE_COUNT = canvas.width / GRID_SIZE;

  let gameMode = 1; // 1 = Snake 1 (Walls lose), 2 = Snake 2 (Pass-through walls)
  let snake = [{ x: 10, y: 10 }];
  let dx = 1, dy = 0;
  let nextDx = 1, nextDy = 0;
  let food = { x: 5, y: 5 };
  let score = 0;
  let gameOver = false;

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    dx = 1; dy = 0;
    nextDx = 1; nextDy = 0;
    score = 0;
    scoreElem.innerText = "SCORE: " + score;
    gameOver = false;
    spawnFood();
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * TILE_COUNT);
    food.y = Math.floor(Math.random() * TILE_COUNT);
  }

  function update() {
    if (gameOver) return;

    dx = nextDx;
    dy = nextDy;

    let head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Snake II Mode: Wrap around screen borders
    if (gameMode === 2) {
      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;
    } else {
      // Snake I Mode: Wall collision = Game Over
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver = true;
        return;
      }
    }

    // Self-collision check
    for (let i = 0; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        gameOver = true;
        return;
      }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreElem.innerText = "SCORE: " + score;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // Game Boy light olive green background
    ctx.fillStyle = "#8bac0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Snake I outer border
    if (gameMode === 1) {
      ctx.strokeStyle = "#0f380f";
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    // Draw Food (Dark green block)
    ctx.fillStyle = "#0f380f";
    ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2);

    // Draw Snake body
    ctx.fillStyle = "#306230";
    snake.forEach(part => {
      ctx.fillRect(part.x * GRID_SIZE, part.y * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2);
    });

    // Game Over Overlay
    if (gameOver) {
      ctx.fillStyle = "#0f380f";
      ctx.font = "24px monospace";
      ctx.fillText("GAME OVER", 130, 190);
      ctx.font = "14px monospace";
      ctx.fillText("Press OK to Restart", 120, 220);
    }
  }

  function main() {
    update();
    draw();
  }

  // Key Listeners for Sony TV Remote
  window.addEventListener("keydown", function(e) {
    const key = e.keyCode || e.which;

    // Prevent TV browser default scrolling behavior
    if([37, 38, 39, 40, 13, 50, 52, 54, 56].indexOf(key) > -1) {
      e.preventDefault();
    }

    switch (key) {
      // 2 Key (UP)
      case 50: // Standard '2'
      case 19: // Sony TV '2'
        if (dy === 0) { nextDx = 0; nextDy = -1; }
        break;

      // 4 Key (LEFT)
      case 52: // Standard '4'
      case 21: // Sony TV '4'
        if (dx === 0) { nextDx = -1; nextDy = 0; }
        break;

      // 6 Key (RIGHT)
      case 54: // Standard '6'
      case 23: // Sony TV '6'
        if (dx === 0) { nextDx = 1; nextDy = 0; }
        break;

      // 8 Key (DOWN)
      case 56: // Standard '8'
      case 25: // Sony TV '8'
        if (dy === 0) { nextDx = 0; nextDy = 1; }
        break;

      // OK / Enter Button (Switch Mode OR Restart)
      case 13:
      case 29443: // Sony TV Enter/Select code
        if (gameOver) {
          resetGame();
        } else {
          // Switch between Snake I and Snake II
          gameMode = (gameMode === 1) ? 2 : 1;
          modeElem.innerText = (gameMode === 1) ? "SNAKE I" : "SNAKE II";
          resetGame();
        }
        break;
    }
  });

  resetGame();
  setInterval(main, 100);
</script>
</body>
</html>
