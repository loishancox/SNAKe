<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia SNAKe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body, html { 
            width: 100%; height: 100%; 
            background: #7d8c6b; 
            font-family: monospace; 
            color: #1c2416;
            overflow: hidden;
        }
        #game-container {
            width: 128px;
            height: 160px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #hud {
            width: 100%;
            height: 14px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            border-bottom: 1px solid #1c2416;
        }
        #grid-display {
            width: 100%;
            height: 100px;
            background: #8fa382;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }
        .cell { border: 0.5px solid rgba(28, 36, 22, 0.05); }
        .snake { background: #1c2416; }
        .food { background: #3a4d2f; border: 2px solid #1c2416; }
        
        /* Links arranged as a giant d-pad grid that Opera Mini can click */
        #control-links {
            width: 100%;
            height: 46px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            background: #55604d;
            gap: 1px;
        }
        .nav-link {
            background: #7d8c6b;
            color: #1c2416;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .nav-link:transparent { background: #55604d; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>SPD: <span id="speed-val">1</span></span>
        </div>

        <!-- Pure HTML Grid Layout -->
        <div id="grid-display" id="matrix-board"></div>

        <!-- Clickable Links that your Nokia mouse cursor can click -->
        <div id="control-links">
            <a href="javascript:void(0);" class="nav-link" id="btn-1" onclick="changeSpeed(-1)">1 ⏬</a>
            <a href="javascript:void(0);" class="nav-link" id="btn-2" onclick="setDir(0,-1)">2 ⬆️</a>
            <a href="javascript:void(0);" class="nav-link" id="btn-3" onclick="changeSpeed(1)">3 ⏫</a>
            <a href="javascript:void(0);" class="nav-link" id="btn-4" onclick="setDir(-1,0)">4 ⬅️</a>
            <a href="javascript:void(0);" class="nav-link" id="btn-8" onclick="setDir(0,1)">8 ⬇️</a>
            <a href="javascript:void(0);" class="nav-link" id="btn-6" onclick="setDir(1,0)">6 ➡️</a>
        </div>
    </div>

    <script>
        const board = document.getElementById('grid-display');
        const scoreLbl = document.getElementById('score-val');
        const speedLbl = document.getElementById('speed-val');

        const cols = 12;
        const rows = 10;
        let snake = [{x:4, y:5}, {x:3, y:5}];
        let dir = {x:1, y:0};
        let food = {x:8, y:5};
        let score = 0;
        let speedLevel = 1;
        let speeds =;
        let loop = null;

        function buildGrid() {
            board.innerHTML = '';
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (snake.some(s => s.x === x && s.y === y)) {
                        cell.className += ' snake';
                    } else if (food.x === x && food.y === y) {
                        cell.className += ' food';
                    }
                    board.appendChild(cell);
                }
            }
        }

        function setDir(nx, ny) {
            if ((nx !== 0 && dir.x === 0) || (ny !== 0 && dir.y === 0)) {
                dir = {x: nx, y: ny};
            }
            tick(); // Instantly update view when Nokia forces page link refresh
        }

        function changeSpeed(delta) {
            speedLevel = Math.max(1, Math.min(4, speedLevel + delta));
            speedLbl.innerText = speedLevel;
            clearInterval(loop);
            loop = setInterval(tick, speeds[speedLevel - 1]);
        }

        function tick() {
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Wrap edges
            if (head.x >= cols) head.x = 0; if (head.x < 0) head.x = cols - 1;
            if (head.y >= rows) head.y = 0; if (head.y < 0) head.y = rows - 1;

            // Self crash
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                snake = [{x:4, y:5}, {x:3, y:5}];
                dir = {x:1, y:0};
                score = 0;
                scoreLbl.innerText = score;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreLbl.innerText = score;
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } else {
                snake.pop();
            }
            buildGrid();
        }

        buildGrid();
        loop = setInterval(tick, speeds[speedLevel - 1]);
    </script>
</body>
</html>
