<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Arcade</title>
    <style>
        /* Forces hardware viewport alignment on Series 30+ / Opera Mini engines */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }

        /* 1.8-inch Container Engine (128x160 Native Scaling Mode) */
        #viewport-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 320px;
            max-height: 400px;
            aspect-ratio: 128 / 160;
            display: flex;
            flex-direction: column;
            background: #7d8c6b;
            padding: 4px;
            transition: all 0.2s ease;
        }

        /* Mode: Authentic Retro 1110/3310 Dot-Matrix Border Bezel */
        #viewport-container.retro-bezel {
            background: #111;
            border: 8px solid #222;
            border-radius: 4px;
        }
        #viewport-container.retro-bezel #screen-wrapper {
            background: #8fa382;
            border: 4px solid #55604d;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Status & Beep HUD Display Layout */
        #hud-bar {
            width: 100%;
            height: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #1c2416;
            font-weight: bold;
            padding: 0 4px;
            border-bottom: 1px dashed #55604d;
        }

        canvas {
            width: 100%;
            flex-grow: 1;
            image-rendering: pixelated;
            background: transparent;
        }

        #overlay-screen {
            position: absolute;
            top: 16px;
            left: 0;
            width: 100%;
            bottom: 0;
            background: rgba(143, 163, 130, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1c2416;
            padding: 8px;
            text-align: center;
        }
        .menu-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
        .menu-item { font-size: 10px; margin: 2px 0; }
        .menu-item.active { background: #1c2416; color: #8fa382; padding: 0 4px; }
    </style>
</head>
<body>

    <div id="viewport-container" class="retro-bezel">
        <div id="screen-wrapper">
            <!-- Nokia S30+ Top Display Ribbon Bar -->
            <div id="hud-bar">
                <span id="game-mode-label">SNAKE 1</span>
                <span id="audio-indicator">🔊</span>
                <span id="score-label">0000</span>
            </div>

            <!-- Resolution Context Matrix Element -->
            <canvas id="gameCanvas"></canvas>

            <!-- Virtual Selection Engine Frame Overlay -->
            <div id="overlay-screen">
                <div class="menu-title" id="modal-title">Nokia Arcade</div>
                <div id="menu-options-box">
                    <div class="menu-item active" id="opt-s1">[2/8 Select]</div>
                    <div class="menu-item" id="opt-s2">Snake 1 (Classic)</div>
                    <div class="menu-item" id="opt-s3">Snake 2 (Mazes)</div>
                </div>
                <div class="menu-item" style="margin-top:8px; font-size:8px;" id="modal-footer">Press ENTER/5 to Play</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('viewport-container');
        const overlay = document.getElementById('overlay-screen');
        const scoreLabel = document.getElementById('score-label');
        const modeLabel = document.getElementById('game-mode-label');
        const audioIndicator = document.getElementById('audio-indicator');
        
        // Logical grid coordinates for classic pixel-density matrix
        const gridWidth = 20;
        const gridHeight = 22;

        let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAME_OVER
        let gameMode = 1;      // 1 = Snake 1, 2 = Snake 2
        let soundEnabled = true;
        let retroDisplayEngine = true;
        let menuSelection = 1; // 1 = Snake 1, 2 = Snake 2

        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let gameLoopInterval = null;
        let currentSpeed = 140;

        // Snake 2 Wall Geometry Definition Blocks
        const mazes = [
            // Outer Ring Blockades + Center Core Partition Walls
            [{x:5, y:5}, {x:6, y:5}, {x:7, y:5}, {x:13, y:5}, {x:14, y:5}, {x:15, y:5},
             {x:5, y:16}, {x:6, y:16}, {x:7, y:16}, {x:13, y:16}, {x:14, y:16}, {x:15, y:16},
             {x:9, y:10}, {x:10, y:10}, {x:9, y:11}, {x:10, y:11}]
        ];

        // Custom Web Audio API Oscillator Synth Bleeps
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // System Interface Controller Key Bindings Mapping
        window.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();

            // Intercept standard default scrolling logic for feature phone inputs
            if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key)) {
                e.preventDefault();
            }

            // Global Control Logic Action Toggles (#, 0, *)
            if (e.key === '#') {
                soundEnabled = !soundEnabled;
                audioIndicator.innerText = soundEnabled ? "🔊" : "🔇";
                playBeep(400, 0.05);
                return;
            }
            if (e.key === '0') {
                gameMode = gameMode === 1 ? 2 : 1;
                modeLabel.innerText = `SNAKE ${gameMode}`;
                playBeep(600, 0.05);
                if(gameState === 'PLAYING') resetGame();
                else updateMenuUI();
                return;
            }
            if (e.key === '*') {
                retroDisplayEngine = !retroDisplayEngine;
                container.className = retroDisplayEngine ? "retro-bezel" : "";
                resizeCanvas();
                playBeep(500, 0.05);
                return;
            }

            // Menu Viewport Logic Flow Navigation
            if (gameState === 'MENU' || gameState === 'GAME_OVER') {
                if (key === '2' || e.key === 'ArrowUp') {
                    menuSelection = 1;
                    updateMenuUI();
                    playBeep(300, 0.03);
                } else if (key === '8' || e.key === 'ArrowDown') {
                    menuSelection = 2;
                    updateMenuUI();
                    playBeep(300, 0.03);
                } else if (e.key === 'Enter' || key === '5') {
                    gameMode = menuSelection;
                    modeLabel.innerText = `SNAKE ${gameMode}`;
                    resetGame();
                }
                return;
            }

            // Live Game Intercept Directives
            if (gameState === 'PLAYING') {
                if ((key === '2' || e.key === 'ArrowUp') && direction.y === 0) nextDirection = { x: 0, y: -1 };
                else if ((key === '8' || e.key === 'ArrowDown') && direction.y === 0) nextDirection = { x: 0, y: 1 };
                else if ((key === '4' || e.key === 'ArrowLeft') && direction.x === 0) nextDirection = { x: -1, y: 0 };
                else if ((key === '6' || e.key === 'ArrowRight') && direction.x === 0) nextDirection = { x: 1, y: 0 };
                else if (key === '5') {
                    gameState = 'PAUSED';
                    overlay.style.display = 'flex';
                    document.getElementById('modal-title').innerText = "PAUSED";
                    document.getElementById('menu-options-box').innerHTML = '<div class="menu-item active">Resume (5/Enter)</div>';
                    playBeep(200, 0.1);
                }
            } else if (gameState === 'PAUSED') {
                if (key === '5' || e.key === 'Enter') {
                    gameState = 'PLAYING';
                    overlay.style.display = 'none';
                    playBeep(440, 0.08);
                }
            }
        });
